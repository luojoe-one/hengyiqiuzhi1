name: Build Mac DMG 测评安装包
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: write-all

jobs:
  build-mac-dmg:
    runs-on: macos-latest
    timeout-minutes: 20
    # 全局注入GH_TOKEN，所有步骤生效
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 拉取项目源码
        uses: actions/checkout@v4

      - name: 配置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装npm依赖
        run: npm install

      - name: 打包Mac .dmg镜像
        run: npm run build-mac

      - name: 检查打包输出
        run: ls -la dist

      # v4 无需额外env，全局已经注入GH_TOKEN
      - name: 上传dmg安装包
        uses: actions/upload-artifact@v4
        with:
          name: 测评_Mac安装包
          path: dist/*.dmg
          if-no-files-found: error
