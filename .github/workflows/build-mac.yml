name: Build Mac DMG 测评安装包
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 全开权限
permissions: write-all

jobs:
  build-mac-dmg:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: 拉取项目源码
        uses: actions/checkout@v4

      - name: 配置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装npm依赖
        run: npm install

      - name: 打包Mac .dmg镜像
        run: npm run build-mac

      # 关键：把内置GITHUB_TOKEN赋值给GH_TOKEN，解决v4校验报错
      - name: 上传dmg安装包
        uses: actions/upload-artifact@v4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Aon测评_Mac安装包
          path: dist/*.dmg
          if-no-files-found: error
