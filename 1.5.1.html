        }
        /* 顶部进度条 */
        .progress-bar-wrap {
            width: 100%;
            height: 6px;
            background: #e6e6e6;
            border-radius: 3px;
            margin-bottom: 48px;
        }
        .progress-fill {
            height: 100%;
            width: 5%;
            background: #999999;
            border-radius: 3px;
            transition: 0.4s ease;
        }
        .questions-wrap {
            display: flex;
            flex-direction: column;
            gap: 46px;
        }
        /* 整行容器：左题 + 中线 + 右题 + 共用一条滑块 */
        .question-row {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 0;
            align-items: stretch;
            row-gap: 20px;
        }
        .q-left {
            grid-column: 1;
            text-align: left;
            padding-right: 30px;
        }
        .q-divider {
            grid-column: 2;
            background: #cccccc;
        }
        .q-right {
            grid-column: 3;
            text-align: right;
            padding-left: 30px;
        }
        /* 滑块区域整行跨三列 */
        .slider-full-row {
            grid-column: 1 / 4;
            position: relative;
            height: 44px;
            display: flex;
            align-items: center;
        }
        .q-text {
            font-size: 17px;
            color: #333;
            line-height: 1.55;
        }
        .slider-line {
            width: 100%;
            height: 2px;
            background-color: #cccccc;
            position: absolute;
        }
        .dot-group {
            width: 100%;
            display: flex;
            justify-content: space-between;
            position: relative;
        }
        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #cccccc;
            background: #fff;
            z-index: 2;
            cursor: pointer;
        }
        .dot.selected {
            background-color: #aaaaaa;
            border-color: #aaaaaa;
        }
        .arrow-left, .arrow-right {
            position: absolute;
            top: 12px;
            font-size: 20px;
            color: #bbbbbb;
            z-index: 3;
        }
        .arrow-left {left: -12px;}
        .arrow-right {right: -12px;}
        /* 底部标签整行跨三列 */
        .label-full-row {
            grid-column: 1 / 4;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }

const progressBar = document.getElementById('progressBar');
const questionsBox = document.getElementById('questionsBox');
const timerText = document.getElementById('timerText');

// 启动倒计时
function startTimer() {
    timerInterval = setInterval(()=>{
        remainSeconds--;
        const min = Math.floor(remainSeconds / 60);
        const sec = remainSeconds % 60;
        timerText.innerText = `剩余时间：${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

        if(remainSeconds <= 0){
            clearInterval(timerInterval);
            timeOutSubmit();
        }
    },1000);
}

// 超时强制提交
function timeOutSubmit(){
    alert("测评时间已到，系统自动提交答案！");
    console.log("超时自动提交，作答数据：", answerRecord);
    // 尝试关闭页面
    window.close();
}

function renderPage(){
    questionsBox.innerHTML = "";
    const startIdx = currentPageIndex * PAGE_SIZE;
    const pageData = questionBank.slice(startIdx, startIdx + PAGE_SIZE);

    pageData.forEach(item=>{
        const rowDom = document.createElement('div');
        rowDom.className = "question-row";
        rowDom.dataset.qid = item.id;
        rowDom.innerHTML = `
            <div class="q-left">
                <div class="q-text">${item.left}</div>
            </div>
            <div class="q-divider"></div>
            <div class="q-right">
                <div class="q-text">${item.right}</div>
            </div>
            <!-- 共用一条滑块，整行跨三栏 -->
            <div class="slider-full-row">
                <span class="arrow-left">&lt;</span>
                <div class="slider-line"></div>
                <div class="dot-group">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <span class="arrow-right">&gt;</span>
            </div>
            <!-- 底部标签也是整行跨三栏 -->
            <div class="label-full-row">
                <span class="label-text">非常赞同</span>
                <span class="label-text"></span>
                <span class="label-text">比较赞同</span>
                <span class="label-text"></span>
                <span class="label-text">比较赞同</span>
                <span class="label-text"></span>
                <span class="label-text">非常赞同</span>
            </div>
        `;
        questionsBox.appendChild(rowDom);
        bindDotClick(rowDom);
        // 恢复已选项
        if(answerRecord[item.id] !== undefined){
            const dots = rowDom.querySelectorAll('.dot');
            dots[answerRecord[item.id]].classList.add('selected');
        }
    })
}

function bindDotClick(rowDom){
    const qid = rowDom.dataset.qid;
    const dots = rowDom.querySelectorAll('.dot');
    dots.forEach((dot, idx)=>{
        dot.onclick = function(){
            dots.forEach(d=>d.classList.remove('selected'));
            this.classList.add('selected');
            answerRecord[qid] = idx;
            checkPageComplete();
        }
    })
}

function checkPageComplete(){
    const allRows = document.querySelectorAll('.question-row');
    let finished = 0;
    allRows.forEach(row=>{
        if(row.querySelector('.dot.selected')) finished++;
    })
    if(finished === PAGE_SIZE){
        setTimeout(nextPage, 600);
    }
}

function nextPage(){
    currentPageIndex++;
    progressBar.style.width = (5 + currentPageIndex * STEP_PER_PAGE) + "%";
    const totalPages = Math.ceil(TOTAL_ALL_QUESTIONS / PAGE_SIZE);
    if(currentPageIndex >= totalPages){
        clearInterval(timerInterval);
        alert("测评完成！");
        console.log("全部作答数据", answerRecord);
        window.close();
        return;
    }
    renderPage();
}

// 初始化
renderPage();
startTimer();
</script>
